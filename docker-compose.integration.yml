name: core-integration

services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.11
    command:
      - /usr/local/bin/etcd
      - --name=core-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=core-etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=core-integration
    ports:
      - "127.0.0.1:2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  consul:
    image: hashicorp/consul:1.21.3
    command: ["agent", "-dev", "-client=0.0.0.0", "-log-level=warn"]
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.12.8-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    profiles: ["kafka"]
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 10s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4.4
    profiles: ["persistence"]
    environment:
      MYSQL_DATABASE: core_test
      MYSQL_USER: core_test
      MYSQL_PASSWORD: core_test_password
      MYSQL_ROOT_PASSWORD: core_test_root_password
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u core_test -pcore_test_password --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s

  mongodb:
    image: mongo:7.0.16
    profiles: ["persistence"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: core_test_admin
      MONGO_INITDB_ROOT_PASSWORD: core_test_root_password
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          -u core_test_admin -p core_test_root_password
          --authenticationDatabase admin
          --eval 'const a=db.getSiblingDB("admin"); if (!a.getUser("core_test")) { a.createUser({user:"core_test",pwd:"core_test_password",roles:[{role:"readWrite",db:"core_test"}]}); } a.runCommand({ping:1}).ok' | grep 1
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39
    profiles: ["persistence"]
    environment:
      CLICKHOUSE_DB: core_test
      CLICKHOUSE_USER: core_test
      CLICKHOUSE_PASSWORD: core_test_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 --user core_test --password core_test_password --query 'SELECT 1' | grep 1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
