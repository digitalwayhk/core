      - name: 写入执行摘要
        if: ${{ always() }}
        run: printf '### required/race\n\n- 状态：`%s`\n- 复现：`./scripts/ci.sh required/race`\n' '${{ steps.gate.outcome }}' >>"$GITHUB_STEP_SUMMARY"
      - name: 上传门禁日志
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-race-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
