name: Required CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quick:
    name: required/quick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_ARTIFACT_DIR: ${{ runner.temp }}/core-ci/quick
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - id: gate
        run: ./scripts/ci.sh required/quick
      - name: 写入执行摘要
        if: ${{ always() }}
        run: printf '### required/quick\n\n- 状态：`%s`\n- 复现：`./scripts/ci.sh required/quick`\n' '${{ steps.gate.outcome }}' >>"$GITHUB_STEP_SUMMARY"
      - name: 上传门禁日志
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-quick-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7

  contracts:
    name: required/contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI_ARTIFACT_DIR: ${{ runner.temp }}/core-ci/contracts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - id: gate
        run: ./scripts/ci.sh required/contracts
      - name: 写入执行摘要
        if: ${{ always() }}
        run: printf '### required/contracts\n\n- 状态：`%s`\n- 复现：`./scripts/ci.sh required/contracts`\n' '${{ steps.gate.outcome }}' >>"$GITHUB_STEP_SUMMARY"
      - name: 上传门禁日志
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-contracts-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7

  server-manage:
    name: required/server-manage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_ARTIFACT_DIR: ${{ runner.temp }}/core-ci/server-manage
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - id: gate
        run: ./scripts/ci.sh required/server-manage
      - name: 写入执行摘要
        if: ${{ always() }}
        run: printf '### required/server-manage\n\n- 状态：`%s`\n- 复现：`./scripts/ci.sh required/server-manage`\n' '${{ steps.gate.outcome }}' >>"$GITHUB_STEP_SUMMARY"
      - name: 上传门禁日志
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-server-manage-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7

  race:
    name: required/race
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI_ARTIFACT_DIR: ${{ runner.temp }}/core-ci/race
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
