name: Consumer Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  futures:
    name: consumer/futures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_ARTIFACT_DIR: ${{ runner.temp }}/core-ci/consumer-futures
      FUTURES_COMMIT: 203ff8eda53a9691d9409d3ee32aa5868fa1d61f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: core
      - id: access
        name: 检查消费方凭据
        env:
          FUTURES_REPOSITORY_TOKEN: ${{ secrets.FUTURES_REPOSITORY_TOKEN }}
        run: |
          mkdir -p "$CI_ARTIFACT_DIR"
          if [[ -z "$FUTURES_REPOSITORY_TOKEN" ]]; then
            echo 'CONSUMER_SMOKE_STATUS=blocked reason=futures_repository_token_unavailable' \
              | tee "$CI_ARTIFACT_DIR/status.log"
            exit 3
          fi
          echo 'CONSUMER_SMOKE_STATUS=ready' >"$CI_ARTIFACT_DIR/status.log"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: digitalwayhk/futures
          ref: ${{ env.FUTURES_COMMIT }}
          token: ${{ secrets.FUTURES_REPOSITORY_TOKEN }}
          persist-credentials: false
          path: futures
      - id: gate
        working-directory: core
        env:
          CORE_FUTURES_REPO: ${{ github.workspace }}/futures
          CORE_FUTURES_COMMIT: ${{ env.FUTURES_COMMIT }}
        run: ./scripts/ci.sh consumer/futures
      - name: 写入执行摘要
        if: ${{ always() }}
        run: |
          printf '### consumer/futures\n\n- 凭据：`%s`\n- smoke：`%s`\n- commit：`%s`\n' \
            '${{ steps.access.outcome }}' '${{ steps.gate.outcome }}' "$FUTURES_COMMIT" \
            >>"$GITHUB_STEP_SUMMARY"
      - name: 上传消费方证据
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-futures-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
