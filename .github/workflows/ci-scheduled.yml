name: Scheduled CI

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: scheduled/stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_ARTIFACT_DIR: ${{ runner.temp }}/core-ci/stress
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - id: gate
        run: ./scripts/ci.sh scheduled/stress
      - name: 写入执行摘要
        if: ${{ always() }}
        run: |
          printf '### scheduled/stress\n\n- 状态：`%s`\n- 复现：`./scripts/ci.sh scheduled/stress`\n' \
            '${{ steps.gate.outcome }}' >>"$GITHUB_STEP_SUMMARY"
      - name: 上传门禁日志
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduled-stress-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7

  persistence-integration:
    name: scheduled/integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_ARTIFACT_DIR: ${{ runner.temp }}/core-ci/persistence-integration
      CORE_TEST_PERSISTENCE_PROJECT_NAME: core-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - id: gate
        run: ./scripts/ci.sh scheduled/integration
      - name: 写入执行摘要
        if: ${{ always() }}
        run: |
          printf '### scheduled/integration\n\n- 状态：`%s`\n- 复现：`./scripts/ci.sh scheduled/integration`\n' \
            '${{ steps.gate.outcome }}' >>"$GITHUB_STEP_SUMMARY"
      - name: 上传门禁日志与 Compose 诊断
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduled-integration-${{ github.run_attempt }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
